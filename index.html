<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&family=Baloo+Da+2:wght@500;700&family=Hind+Siliguri:wght@500;700&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@500;700&family=Galada&family=Mina:wght@400;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@500;700&family=Poppins:wght@500;700&family=Inter:wght@500;700&family=Lato:wght@400;700&family=Raleway:wght@500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Merriweather:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0d0d0d;--bg2:#121212;--bg3:#1f1f1f;--fg:#f5f5f5;--mut:#bdbdbd;--pn:rgba(255,255,255,.05);--bd:rgba(0,173,181,.35);--ac:#00ADB5;--inp:rgba(0,0,0,.45);--btn:linear-gradient(135deg,#00ADB5,#2fd0d8);--btnt:#0d0d0d;--alt:linear-gradient(135deg,#1c1c1c,#2e2e2e);--altt:#fff;--glow:rgba(0,173,181,.25);--sp:radial-gradient(circle at 25% 15%,#2c2c2c 0,#161616 45%,#0a0a0a 100%);--ttl:linear-gradient(90deg,#fff,#7ee8ee 55%,#00ADB5);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="min"]{--bg1:#F6EEE2;--bg2:#F5DDE6;--bg3:#DCCFF4;--fg:#2f2f36;--mut:#6b6b76;--pn:rgba(255,250,246,.78);--bd:rgba(90,90,102,.2);--ac:#8466cf;--inp:#FBF7F2;--btn:linear-gradient(135deg,#F3C6D8,#CBB7F0);--btnt:#2f2f36;--alt:linear-gradient(135deg,#6b6b76,#3f3f48);--altt:#fff;--glow:rgba(170,130,210,.3);--sp:radial-gradient(circle at 25% 15%,#F8F1E6 0,#F5DDE6 50%,#D6C8F2 100%);--ttl:linear-gradient(90deg,#3f3f48,#c0629a 55%,#8466cf)}
:root[data-theme="earth"]{--bg1:#14141c;--bg2:#1A1A24;--bg3:#2b2b3b;--fg:#F4F4F6;--mut:#b4b4c4;--pn:rgba(255,255,255,.05);--bd:rgba(212,163,115,.32);--ac:#D4A373;--inp:rgba(0,0,0,.35);--btn:linear-gradient(135deg,#D4A373,#b7824f);--btnt:#1A1A24;--alt:linear-gradient(135deg,#2b2b3b,#1A1A24);--altt:#F4F4F6;--glow:rgba(212,163,115,.22);--sp:radial-gradient(circle at 25% 15%,#3a3a50 0,#1A1A24 55%,#101018 100%);--ttl:linear-gradient(90deg,#F4F4F6,#D4A373)}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed}
.wrap{max-width:560px;margin:0 auto}
h1{margin:6px 0 14px;font-size:26px;text-align:center;letter-spacing:.5px;background:var(--ttl);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ac)}
canvas{width:100%;height:auto;border-radius:10px;display:block;background:#111;border:1px solid var(--bd);box-shadow:0 8px 30px var(--glow)}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:10px}
.how{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--mut)}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
label.chk{display:flex;align-items:center;gap:8px}
input,textarea,select{font:inherit;color:var(--fg);padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--inp);width:100%;box-sizing:border-box}
input[type=color]{height:38px;padding:2px}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
input[type=range]{padding:0;accent-color:var(--ac)}
input[type=file]{font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-weight:700;padding:13px;border:0;border-radius:10px;color:var(--btnt);background:var(--btn);box-shadow:0 4px 14px var(--glow)}
button.alt{background:var(--alt);color:var(--altt);border:1px solid var(--bd)}
button.th{background:transparent;color:var(--fg);border:1px solid var(--bd);box-shadow:none;font-size:12px;padding:10px 4px}
button.th.on{border-color:var(--ac);color:var(--ac)}
#st{font-size:13px;min-height:18px;color:var(--mut)}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box;background:var(--sp);transition:opacity .7s,visibility .7s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
.sp-in{max-width:420px;animation:rise .9s both}
.sp-e{display:flex;justify-content:center;animation:fly 1.3s cubic-bezier(.2,.8,.2,1) both}
.plane{filter:drop-shadow(0 6px 10px rgba(23,105,170,.45));animation:bob 3s 1.3s ease-in-out infinite}
#splash.go .sp-e{animation:takeoff .9s cubic-bezier(.5,0,.9,.4) forwards}
#splash.go .plane{animation:none}
#splash.go .sp-t,#splash.go #sp-m,#splash.go #sp-b{animation:none;opacity:0;transition:opacity .4s}
@keyframes takeoff{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(240px,-560px) scale(.45) rotate(8deg)}}
@keyframes fly{0%{opacity:0;transform:translate(-140px,40px) rotate(-12deg)}50%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(5deg)}}
.sp-t{margin:10px 0 14px;font-size:30px;line-height:1.2;background:var(--ttl);-webkit-background-clip:text;background-clip:text;color:transparent}
#sp-m{font-size:17px;line-height:1.5;color:var(--fg);margin:0 0 22px;animation:rise 1.2s .3s both}
#sp-b{padding:13px 28px;animation:rise 1.2s .6s both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.wrap{position:relative;z-index:1}
.blob{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.28;background:var(--ac)}
.b1{width:260px;height:260px;top:-60px;left:-80px;animation:drift1 14s ease-in-out infinite}
.b2{width:300px;height:300px;bottom:-90px;right:-100px;animation:drift2 17s ease-in-out infinite;background:var(--bg3);opacity:.55}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,160px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-120px)}}
h1{background-size:220% 100%;animation:shimmer 6s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:220% 0}}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
button{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.96)}
button:not(.th)::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(380%) skewX(-20deg)}}
.panel{transition:border-color .3s,transform .3s}
.panel:hover{border-color:var(--ac)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}


:root{--dock:rgba(18,18,18,.9)}
:root[data-theme="min"]{--dock:rgba(255,250,246,.92)}
:root[data-theme="earth"]{--dock:rgba(26,26,36,.92)}
body.hasdock{padding-bottom:230px}
.dock{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;z-index:20;background:var(--dock);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.35);padding:6px 10px 8px;transform:translateY(140%);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .4s;pointer-events:none}
.dock.show{transform:none;opacity:1;pointer-events:auto}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dt{background:transparent;color:var(--mut);box-shadow:none;border:0;padding:6px 2px;font-size:11px;font-weight:600;display:grid;gap:2px;justify-items:center;border-radius:12px}
.dt::after{display:none!important}
.dt:hover{transform:none}
.dt svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dt.on{color:var(--ac);background:rgba(127,127,127,.14)}
.dbody{padding:6px 4px 2px;display:grid;gap:6px}
.dock.min .dbody{display:none}
.dp[hidden]{display:none}
.dp{display:grid;gap:8px}
.dr{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.dr b{color:var(--ac)}
.dp input[type=range]{height:26px}
.dfit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dfit button,.dp .rb{padding:10px 4px;font-size:13px;border-radius:10px}
.dgo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
button.dsg{display:flex;align-items:center;gap:10px;background:transparent;color:var(--fg);border:1px solid var(--bd);box-shadow:none;padding:10px;text-align:left;font-size:14px}
button.dsg::after{display:none!important}
button.dsg i{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(127,127,127,.4)}
button.dsg.on{border-color:var(--ac);color:var(--ac)}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="splash"><div class="sp-in"><div class="sp-e"><svg class="plane" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1769AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div><div class="sp-t">Welcome to Rafsan's Studio</div><p id="sp-m"></p><button id="sp-b" type="button">Let's create</button></div></div>
<div class="wrap">
<h1>Frame Forge</h1>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="panel">
<h2>Website theme</h2>
<div class="row3"><button class="th" data-t="cine" type="button">Dark Cinematic</button><button class="th" data-t="min" type="button">Minimal Clean</button><button class="th" data-t="earth" type="button">Creative Earthy</button></div>
</div>

<div class="panel">
<h2>Card design</h2>
<div class="row">
<button class="dsg on" data-d="classic" type="button"><i style="background:linear-gradient(135deg,#141414,#e0202f)"></i>Classic</button>
<button class="dsg" data-d="cinema" type="button"><i style="background:linear-gradient(135deg,#121212,#00ADB5)"></i>Cinematic</button>
<button class="dsg" data-d="blush" type="button"><i style="background:linear-gradient(135deg,#F6EEE2,#F3C6D8 50%,#CBB7F0)"></i>Blush</button>
<button class="dsg" data-d="earth" type="button"><i style="background:linear-gradient(135deg,#1A1A24,#D4A373)"></i>Earthy</button>
<button class="dsg" data-d="sunset" type="button"><i style="background:linear-gradient(135deg,#ff7a18,#ff2d75)"></i>Sunset</button>
<button class="dsg" data-d="oldmoney" type="button"><i style="background:linear-gradient(135deg,#2b1810,#5c1a2b 55%,#e3c4a1)"></i>Old Money</button>
<button class="dsg" data-d="daylight" type="button"><i style="background:linear-gradient(135deg,#EFE8DD,#7c3aed 55%,#ec4899)"></i>Daylight</button>
<button class="dsg" data-d="rose" type="button"><i style="background:linear-gradient(135deg,#101016,#ff5c8a)"></i>Rose</button>
</div>
</div>

<div class="panel">
<h2>Fonts</h2>
<div class="row">
<label>Bangla font<select id="fbn"><option value="Hind Siliguri">Hind Siliguri</option><option value="Noto Sans Bengali">Noto Sans Bengali</option><option value="Noto Serif Bengali">Noto Serif Bengali</option><option value="Anek Bangla">Anek Bangla</option><option value="Baloo Da 2">Baloo Da 2</option><option value="Tiro Bangla">Tiro Bangla</option><option value="Galada">Galada</option><option value="Atma">Atma</option><option value="Mina">Mina</option></select></label>
<label>English font<select id="fen"><option value="Hind Siliguri">Hind Siliguri</option><option value="Montserrat">Montserrat</option><option value="Roboto">Roboto</option><option value="Poppins">Poppins</option><option value="Inter">Inter</option><option value="Lato">Lato</option><option value="Raleway">Raleway</option><option value="Oswald">Oswald</option><option value="Playfair Display">Playfair Display</option><option value="Merriweather">Merriweather</option><option value="Bebas Neue">Bebas Neue</option></select></label>
</div>
</div>

<div class="panel">
<h2>Headline</h2>
<label>Headline text
<textarea id="head" rows="3">ঢাকার ৯৮ বাস রুট কমে হবে ৩২, চালু হবে *'এক রুট, এক কোম্পানি'* মডেল</textarea></label>
<div class="row">
<label>Date<input id="date" value="06 October 2026"></label>
<label>Text logo (used if no logo image)<input id="brand" value="METAFEE."></label>
</div>
<div class="row">
<label>Heading gradient: start<input type="color" id="accent" value="#8f0010"></label>
<label>Heading gradient: end<input type="color" id="accent2" value="#e0202f"></label>
<label>Header background: start<input type="color" id="bgc" value="#141414"></label>
<label>Header background: end<input type="color" id="bgc2" value="#4a0a14"></label>
<label>Headline text color<input type="color" id="tcol" value="#ffffff"></label>
</div>
<label>Shadow over the image<input type="range" id="shd" min="0" max="100" value="45"></label>
</div>

<div class="panel">
<h2>Top logo</h2>
<label>Logo image<input type="file" id="logo" accept="image/*"></label>
<label>Top logo size<input type="range" id="k1" min="20" max="250" value="100"></label>
<label class="chk"><input type="checkbox" id="rm" checked> Remove logo background</label>
<label>Background removal strength<input type="range" id="tol" min="10" max="120" value="45"></label>
</div>

<div class="panel">
<h2>Middle image / video</h2>
<label>Image or video<input type="file" id="media" accept="image/*,video/*"></label>
<label class="chk"><input type="checkbox" id="snd" checked> Video sound (preview)</label>
<button id="pp" class="alt" type="button">Play / Pause video</button>
</div>

<div class="panel">
<h2>Footer</h2>
<label>Left logo<input type="file" id="foot" accept="image/*"></label>
<label>Left logo size<input type="range" id="k2" min="20" max="250" value="100"></label>
<label>Right logo (optional)<input type="file" id="foot2" accept="image/*"></label>
<label>Right logo size<input type="range" id="k3" min="20" max="250" value="100"></label>
<div class="row">
<label>Center text<input id="fmid" value=""></label>
<label>Right text (if no right logo)<input id="ftext" value="www.metafee.com"></label>
</div>
<label>Footer color<input type="color" id="fbg" value="#3a3a3a"></label>
</div>

<div class="panel">
<h2>Download</h2>
<button id="dlimg">Download image (PNG)</button>
<button id="dlvid" class="alt">Download video (MP4)</button>
<div id="st"></div>
</div></div>
<div class="dock" id="dock">
<div class="dbody">
<div class="dp" data-t="z"><div class="dr"><span>Zoom</span><b id="vz">100%</b></div><input type="range" id="mz" min="20" max="400" value="100"></div>
<div class="dp" data-t="r" hidden><div class="dr"><span>Rotate</span><b id="vr">0°</b></div><div class="dgo"><input type="range" id="mr" min="-180" max="180" value="0"><button class="alt rb" id="br9" type="button">+90°</button></div></div>
<div class="dp" data-t="m" hidden><div class="dr"><span>Left / Right</span></div><input type="range" id="mpx" min="-100" max="100" value="0"><div class="dr"><span>Up / Down</span></div><input type="range" id="mpy" min="-100" max="100" value="0"></div>
<div class="dp" data-t="f" hidden><div class="dfit"><button id="bfw" type="button">Fit width</button><button id="bfa" type="button">Fill area</button><button class="alt" id="brs" type="button">Reset</button></div></div>
</div>
<div class="dtabs">
<button class="dt" data-t="z" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>Zoom</button>
<button class="dt" data-t="r" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Rotate</button>
<button class="dt" data-t="m" type="button"><svg viewBox="0 0 24 24"><path d="m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>Move</button>
<button class="dt" data-t="f" type="button"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>Fit</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const FF=()=>`"${$('fen').value}","${$('fbn').value}",sans-serif`;
const W=1080,H=1350,cv=document.getElementById('c');let x=cv.getContext('2d');const mainX=x;let dirty=true;
const $=id=>document.getElementById(id);
let vidFile=null,ov=null,logoImg=null,footImg=null,foot2Img=null,mImg=null,vid=null,recording=false;
let actx=null,dst=null,mon=null;
function setupAudio(v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();dst=actx.createMediaStreamDestination();
 const src=actx.createMediaElementSource(v);mon=actx.createGain();mon.gain.value=$('snd').checked?1:0;src.connect(dst);src.connect(mon);mon.connect(actx.destination);actx.resume()}catch(e){dst=null}}
function loadImg(file,cb){const i=new Image();i.onload=()=>{cb(i);dirty=true};i.src=URL.createObjectURL(file)}
$('logo').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{logoImg=i});
$('foot2').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{foot2Img=i});
$('foot').onchange=e=>e.target.files[0]&&loadImg(e.target.files[0],i=>{footImg=i});
$('media').onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(vid){vid.pause();vid=null}mImg=null;
 if(f.type.startsWith('video')){vidFile=f;const v=document.createElement('video');v.src=URL.createObjectURL(f);v.loop=true;v.playsInline=true;v.preload='auto';v.onloadeddata=()=>{vid=v;setupAudio(v);v.play().catch(()=>{$('st').textContent='Tap Play / Pause to start the video'})};}
 else loadImg(f,i=>{mImg=i});};
function cover(src,sw,sh,dx,dy,dw,dh){const s=Math.max(dw/sw,dh/sh),w=sw*s,h=sh*s;
 x.save();x.beginPath();x.rect(dx,dy,dw,dh);x.clip();x.drawImage(src,dx+(dw-w)/2,dy+(dh-h)/2,w,h);x.restore();}
function words(t,accent){const out=[];let hi=false;
 t.split(/(\*)/).forEach(p=>{if(p==='*'){hi=!hi;return}p.split(/\s+/).filter(Boolean).forEach(w=>out.push({w,c:hi?'G':'T'}))});return out;}
function headline(top,bot,maxW,fsMax,shadow,hl){const ws=words($('head').value,$('accent').value);
 if(shadow){x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=14;x.shadowOffsetY=3}
 for(let fs=fsMax;fs>=34;fs-=2){x.font=`700 ${fs}px ${FF()}`;
  const sp=x.measureText(' ').width,lines=[];let cur=[],cw=0;
  ws.forEach(o=>{const w=x.measureText(o.w).width;if(cur.length&&cw+sp+w>maxW){lines.push({a:cur,w:cw});cur=[];cw=0}
   cur.push({...o,mw:w});cw+=(cur.length>1?sp:0)+w});
  if(cur.length)lines.push({a:cur,w:cw});
  const lh=fs*1.3;
